
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloud Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px 16px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000012;
        }

        h1 {
            text-align: center;
        }

        .add-form, .task {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 0;
        }

        button {
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete {
            background: #dc2626;
        }

        .task {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .task-title {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        .task form {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cloud Task Manager</h1>

        <form method="post"
              action="{% url 'add_task' %}"
              class="add-form">
            {% csrf_token %}
            {{ form.title }}
            <button type="submit">Add</button>
        </form>

        <h2>My Tasks</h2>

        {% for task in tasks %}
            <div class="task">

                <form method="post"
                      action="{% url 'toggle_task' task.id %}">
                    {% csrf_token %}
                    <button type="submit">
                        {% if task.is_completed %}
                            Undo
                        {% else %}
                            Done
                        {% endif %}
                    </button>
                </form>

                <span class="task-title
                    {% if task.is_completed %}completed{% endif %}">
                    {{ task.title }}
                </span>

                <form method="post"
                      action="{% url 'delete_task' task.id %}">
                    {% csrf_token %}
                    <button type="submit" class="delete">
                        Delete
                    </button>
                </form>

            </div>
        {% empty %}
            <p>No tasks yet. Add your first task!</p>
        {% endfor %}
    </div>
</body>
</html>
